version: '3.8'

services:
  db:
    container_name: db
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: noshi
      POSTGRES_PASSWORD: noshi
      POSTGRES_DB: noshi
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noshi -d noshi"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  app:
    container_name: noshi-back
    image: ghcr.io/linhphandk/noshi-back:latest
    restart: unless-stopped
    environment:
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=3000
      - DATABASE_URL=postgres://noshi:noshi@db:5432/noshi
      - DATABASE_POOL_SIZE=4
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRY_MINUTES=15
      - AWS_S3_BUCKET=${AWS_S3_BUCKET}
      - AWS_REGION=${AWS_REGION}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - S3_PUBLIC_URL=${S3_PUBLIC_URL}
      - SES_FROM_EMAIL=${SES_FROM_EMAIL}
      - SES_FROM_NAME=${SES_FROM_NAME}
      - NOTIFICATION_EMAIL=${NOTIFICATION_EMAIL}
      - TOKEN_ENCRYPTION_KEY=${TOKEN_ENCRYPTION_KEY}
      - RUST_LOG=info
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network
    ports:
      - "3000:3000"

volumes:
  pgdata:

networks:
  app-network:
    driver: bridge
